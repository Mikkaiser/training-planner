name: training-planner-db

services:
  db:
    image: postgres:17.4
    container_name: training-planner-db
    restart: unless-stopped
    env_file:
      - .env.db
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - /root/server/db-volumes/training-planner/pgdata:/var/lib/postgresql/data
    # Bound to loopback only: nao fica exposto na internet.
    ports:
      - "127.0.0.1:${PG_HOST_PORT}:5432"
    networks:
      - training-planner-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  training-planner-network:
    external: true
    name: training-planner-network
