name: training-planner

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: training-planner-next:latest
    container_name: training-planner-web
    restart: always
    env_file:
      - .env
    networks:
      - training-planner-network
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  training-planner-network:
    external: true
    name: training-planner-network
